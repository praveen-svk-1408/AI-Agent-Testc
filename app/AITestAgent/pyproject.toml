[project]
name = "ai-test-agent"
version = "1.0.0"
description = "AI-powered test automation agent pipeline using Strands Agents SDK + Amazon Bedrock"
requires-python = ">=3.11"
dependencies = [
    "strands-agents>=1.34.0",
    "strands-agents-tools>=0.1.0",
    "bedrock-agentcore>=1.6.0",
    "pydantic>=2.10.0,<3.0.0",
    "pydantic-settings>=2.7.0,<3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agents", "model", "pipeline", "schemas", "tools", "utils"]
