version: '3.8'

services:
  # PostgreSQL Database (Optional - for production use)
  # Uncomment below to use PostgreSQL instead of SQLite
  # postgres:
  #   image: postgres:16-alpine
  #   container_name: ai-test-postgres
  #   environment:
  #     POSTGRES_USER: user
  #     POSTGRES_PASSWORD: password
  #     POSTGRES_DB: ai_test_db
  #   ports:
  #     - "5432:5432"
  #   volumes:
  #     - postgres_data:/var/lib/postgresql/data
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U user -d ai_test_db"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5
  #   networks:
  #     - ai-test-network

  # Ollama LLM Service (for test generation)
  ollama:
    image: ollama/ollama:latest
    container_name: ai-test-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
    networks:
      - ai-test-network
    # Note: You'll need to run: docker exec ai-test-ollama ollama pull llama2
    # to download the LLaMA 2 model after starting

volumes:
  # postgres_data:  # Uncomment if using PostgreSQL
  ollama_data:

networks:
  ai-test-network:
    driver: bridge
